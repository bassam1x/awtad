# Render Blueprint (الخطة المجانية): خادم واحد يقدّم الـ API والواجهة معاً.
# البيانات في PostgreSQL خارجي (مثل Neon المجاني) عبر DATABASE_URL، فتبقى عند نوم الخدمة أو إعادة تشغيلها.
services:
  - type: web
    name: awtad
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # رابط Neon: postgresql://user:pass@host/db?sslmode=require
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_PASSWORD
        sync: false # تُدخَل يدوياً في لوحة Render
