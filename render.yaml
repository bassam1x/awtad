# Render Blueprint (الخطة المجانية): خادم واحد يقدّم الـ API والواجهة معاً.
# تنبيه: الخطة المجانية بلا قرص دائم، فقاعدة SQLite تُمسح عند كل إعادة تشغيل أو نوم الخدمة.
# للاستخدام الفعلي: غيّر plan إلى starter وأضف قرصاً دائماً:
#   disk: { name: mahara-data, mountPath: /var/data, sizeGB: 1 }
#   وأضف متغير DB_FILE=/var/data/mahara.db
services:
  - type: web
    name: mahara
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false # تُدخَل يدوياً في لوحة Render
