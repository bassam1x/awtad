# Render Blueprint: خادم واحد يقدّم الـ API والواجهة معاً، مع قرص دائم لقاعدة SQLite.
# القرص الدائم يتطلب خطة مدفوعة (starter على الأقل).
services:
  - type: web
    name: mahara
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: mahara-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DB_FILE
        value: /var/data/mahara.db
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false # تُدخَل يدوياً في لوحة Render
