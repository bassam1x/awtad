<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#2563EB" />
    <title>أوتاد</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        var cores = navigator.hardwareConcurrency || 8, mem = navigator.deviceMemory || 8;
        if (cores <= 2 || mem <= 2) document.documentElement.dataset.fx = 'lite';
        var l = localStorage.getItem('mahara-lang');
        if (l === 'en' || l === 'ku' || l === 'ar') { document.documentElement.lang = l; document.documentElement.dir = l === 'en' ? 'ltr' : 'rtl'; }
        var a = localStorage.getItem('mahara-accent'); if (a === 'sunset' || a === 'emerald' || a === 'royal' || a === 'rose' || a === 'gold') document.documentElement.dataset.accent = a;
        var t = localStorage.getItem('mahara-theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
