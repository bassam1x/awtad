<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>معاينة مهارة على آيفون</title>
  <style>
    :root { --w: 390px; --h: 844px; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b1220; font-family: system-ui, sans-serif; }
    .stage { padding: 24px 0; display: grid; gap: 14px; justify-items: center; }
    .phone { position: relative; padding: 14px; border-radius: 62px; background: #1b1f2a;
      box-shadow: 0 0 0 2px #3a4152, 0 0 0 6px #10131b, 0 30px 80px rgba(0,0,0,.6); }
    .phone::before, .phone::after { content: ''; position: absolute; width: 4px; background: #3a4152; border-radius: 2px; }
    .phone::before { left: -8px; top: 150px; height: 60px; }   /* أزرار الصوت */
    .phone::after { right: -8px; top: 200px; height: 90px; }   /* زر القفل */
    .screen { position: relative; width: var(--w); height: var(--h); border-radius: 48px; overflow: hidden; background: #fff; }
    .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; background: #000; border-radius: 20px; z-index: 2; pointer-events: none; }
    .home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 140px; height: 5px; border-radius: 3px; background: rgba(128,128,128,.7); z-index: 2; pointer-events: none; }
    .screen { background: #0b1220; }
    .status { position: absolute; top: 0; left: 0; right: 0; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0; color: #e6edf7; font: 600 15px system-ui; z-index: 1; }
    iframe { position: absolute; top: 50px; left: 0; width: 100%; height: calc(100% - 50px); border: 0; display: block; }
    .bar { display: flex; gap: 8px; }
    button, a { font: 600 13px system-ui; color: #e6edf7; background: #16203a; border: 1px solid #22304d; border-radius: 10px; padding: 8px 14px; cursor: pointer; text-decoration: none; }
    button:hover, a:hover { background: #1d2a4a; }
    @media (max-height: 940px) { .phone { zoom: .85; } }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="screen">
        <div class="island"></div>
        <div class="status" dir="ltr"><span id="clock">9:41</span><span>5G ▮▮▮</span></div>
        <iframe id="app" src="/" title="مهارة"></iframe>
        <div class="home"></div>
      </div>
    </div>
    <div class="bar">
      <button id="reload" type="button">إعادة تحميل</button>
      <a href="/" target="_top">فتح بشكل المتصفح</a>
    </div>
  </div>
  <script>
    const tick = () => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: false }); };
    tick(); setInterval(tick, 30000);
    document.getElementById('reload').onclick = () => document.getElementById('app').contentWindow.location.reload();
  </script>
</body>
</html>
